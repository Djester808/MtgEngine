<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Table viewport verification</title>
<style>
body{margin:4px;background:#222;color:#eee;font:12px system-ui}label{display:inline-flex;gap:8px;margin:0 0 4px}select{font:inherit}iframe{display:block;border:1px solid #777;max-width:none}
</style>
<label>Viewport <select id="viewport"><option value="375,667">Phone · 375 × 667</option><option value="667,375">Landscape · 667 × 375</option><option value="1280,720">Desktop · 1280 × 720</option><option value="1600,900">Large desktop · 1600 × 900</option></select></label>
<button id="measure" type="button">Measure layout</button><output id="metrics" style="display:block;font-size:10px">Board measurements appear here.</output>
<iframe title="Game viewport" id="game" width="375" height="667"></iframe>
<script>
const query=new URLSearchParams(location.search),game=query.get('game');
if(!game||!/^[a-f\d-]{36}$/i.test(game))throw Error('A QA game ID is required.');
const frame=document.getElementById('game');frame.src='/game/'+game;
document.getElementById('viewport').addEventListener('change',event=>{
  const [width,height]=event.target.value.split(',');frame.width=width;frame.height=height;
});
document.getElementById('measure').addEventListener('click',()=>{
  const doc=frame.contentDocument,win=frame.contentWindow;
  const panels=Array.from(doc.querySelectorAll('app-table-seat'));
  const hand=doc.querySelector('app-hand')?.getBoundingClientRect();
  const rows=Array.from(doc.querySelectorAll('.self-table .arrange-area')).map(area=>{
    const a=area.getBoundingClientRect(),piles=Array.from(area.querySelectorAll('.card-pile')).map(p=>p.getBoundingClientRect());
    return {area:area.dataset.area,centerOffset:piles.length?Math.round((Math.min(...piles.map(p=>p.left))+Math.max(...piles.map(p=>p.right))-a.left-a.right)/2):0};
  });
  document.getElementById('metrics').textContent=JSON.stringify({viewport:[win.innerWidth,win.innerHeight],document:[doc.documentElement.scrollWidth,doc.documentElement.scrollHeight],panels:panels.map(panel=>{const r=panel.getBoundingClientRect();return [Math.round(r.width),Math.round(r.height)];}),handHeight:Math.round(hand?.height??0),rows});
});
</script>
</html>
